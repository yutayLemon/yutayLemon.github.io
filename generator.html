<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio GUI Generator</title>
    <style>
        body { font-family: sans-serif; background: #fafafa; color: #333; padding: 2rem; max-width: 900px; margin: 0 auto; }
        h1, h2 { border-bottom: 2px solid #ddd; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 0.25rem; }
        input, textarea { padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        .project-block { background: #fff; border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 6px; position: relative;}
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; border: none; padding: 0.25rem 0.5rem; cursor: pointer; border-radius: 4px;}
        .add-btn { background: #10b981; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; margin-bottom: 2rem;}
        .action-bar { background: #fff; padding: 1rem; border: 2px solid #333; position: sticky; top: 0; display: flex; gap: 1rem; z-index: 100; margin-bottom: 2rem; border-radius: 6px;}
        .export-btn { background: #fcd34d; color: #000; font-weight: bold; border: 2px solid #000; padding: 0.5rem 1rem; cursor: pointer;}
    </style>
</head>
<body>

    <h1>Portfolio GUI Editor</h1>
    <div class="action-bar">
        <div>
            <label style="display:block; font-size: 0.8rem;">1. Import existing config:</label>
            <input type="file" id="importFile" accept=".json">
        </div>
        <button class="export-btn" onclick="exportJSON()">2. Export & Download projects.json</button>
    </div>

    <h2>Profile Information</h2>
    <div class="form-group"><label>Name</label><input type="text" id="prof-name"></div>
    <div class="form-group"><label>Bio</label><textarea id="prof-bio" rows="3"></textarea></div>
    <div class="form-group"><label>Profile Image URL / Path</label><input type="text" id="prof-pic"></div>
    <div class="form-group"><label>GitHub Profile Link</label><input type="text" id="prof-gh"></div>
    <div class="form-group"><label>LinkedIn Link</label><input type="text" id="prof-li"></div>
    <div class="form-group"><label>Resume Link / Path</label><input type="text" id="prof-res"></div>

    <h2>Published Projects</h2>
    <div id="container-published"></div>
    <button class="add-btn" onclick="addProjectRow('published')">+ Add Published Project</button>

    <h2>Hackathon Projects</h2>
    <div id="container-hackathons"></div>
    <button class="add-btn" onclick="addProjectRow('hackathons')">+ Add Hackathon Project</button>

    <h2>Proofs of Concept / Unfinished</h2>
    <div id="container-poc"></div>
    <button class="add-btn" onclick="addProjectRow('poc')">+ Add PoC Project</button>

    <script>
        let currentData = { profile: { socials: {} }, projects: { published: [], hackathons: [], poc: [] } };

        document.getElementById('importFile').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                currentData = JSON.parse(event.target.result);
                populateForm();
            };
            reader.readAsText(e.target.files[0]);
        });

        function populateForm() {
            document.getElementById('prof-name').value = currentData.profile.name || '';
            document.getElementById('prof-bio').value = currentData.profile.bio || '';
            document.getElementById('prof-pic').value = currentData.profile.profilePic || '';
            document.getElementById('prof-gh').value = currentData.profile.socials.github || '';
            document.getElementById('prof-li').value = currentData.profile.socials.linkedin || '';
            document.getElementById('prof-res').value = currentData.profile.socials.resume || '';

            ['published', 'hackathons', 'poc'].forEach(group => {
                const container = document.getElementById(`container-${group}`);
                container.innerHTML = '';
                (currentData.projects[group] || []).forEach(proj => addProjectRow(group, proj));
            });
        }

        function addProjectRow(group, data = {}) {
    const container = document.getElementById(`container-${group}`);
    const div = document.createElement('div');
    div.className = 'project-block';
    div.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()">Remove</button>
        <div class="form-group"><label>Project Title</label><input type="text" class="p-title" value="${data.title || ''}"></div>
        <div class="form-group"><label>Description</label><textarea class="p-desc" rows="2">${data.description || ''}</textarea></div>
        <div class="form-group"><label>GitHub URL</label><input type="text" class="p-github" value="${data.githubLink || ''}"></div>
        
        <div class="form-group"><label>NPM URL (Optional)</label><input type="text" class="p-npm" value="${data.npmLink || ''}"></div>
        
        <div class="form-group"><label>Demo URL (Optional)</label><input type="text" class="p-demo" value="${data.demoLink || ''}"></div>
        <div class="form-group"><label>Technologies (Comma separated)</label><input type="text" class="p-tech" value="${data.technologies ? data.technologies.join(', ') : ''}"></div>
        <div class="form-group"><label>Preview Image URL / Path</label><input type="text" class="p-img" value="${data.image || ''}"></div>
    `;
    container.appendChild(div);
}

        function scrapeGroup(group) {
    const blocks = document.querySelectorAll(`#container-${group} .project-block`);
    const list = [];
    blocks.forEach(b => {
        list.push({
            title: b.querySelector('.p-title').value,
            description: b.querySelector('.p-desc').value,
            githubLink: b.querySelector('.p-github').value,
            
            // 👇 ADD THIS LINE TO EXTRACT NPM VALUE 👇
            npmLink: b.querySelector('.p-npm').value, 
            
            demoLink: b.querySelector('.p-demo').value,
            technologies: b.querySelector('.p-tech').value.split(',').map(t => t.trim()).filter(t => t),
            image: b.querySelector('.p-img').value
        });
    });
    return list;
}

        function exportJSON() {
    const out = {
        profile: {
            name: document.getElementById('prof-name').value,
            bio: document.getElementById('prof-bio').value,
            profilePic: document.getElementById('prof-pic').value,
            socials: {
                github: document.getElementById('prof-gh').value,
                linkedin: document.getElementById('prof-li').value,
                resume: document.getElementById('prof-res').value
            }
        },
        projects: {
            published: scrapeGroup('published'),
            hackathons: scrapeGroup('hackathons'),
            poc: scrapeGroup('poc')
        }
    };

    // (If using projects.js setup, keep the "window.portfolioData =" wrapper here!)
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(out, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "projects.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}
    </script>
</body>
</html>
